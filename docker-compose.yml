# Entwicklungsumgebung: nur die Infrastruktur.
# Weboberfläche und Worker laufen lokal über `npm run dev` und `npm run worker`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seomaster
      POSTGRES_PASSWORD: seomaster
      POSTGRES_DB: seomaster
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seomaster']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenSEO als Beistelldienst (docs/OPENSEO-INTEGRATION.md). In der
  # Entwicklung läuft der Worker auf dem Host, deshalb ist der Port hier –
  # anders als im VPS-Betrieb – gebunden, aber nur an die Loopback-Adresse.
  # Dazu in der .env:  OPENSEO_MCP_URL=http://localhost:3001/mcp
  open-seo:
    image: ghcr.io/every-app/open-seo:latest
    restart: unless-stopped
    environment:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
      AUTH_MODE: local_noauth
      PORT: '3001'
      # base64("email:api-passwort") – anderes Format als DATAFORSEO_LOGIN/
      # -PASSWORD dieser App, deshalb der eigene Variablenname.
      DATAFORSEO_API_KEY: ${OPENSEO_DATAFORSEO_API_KEY:-}
      OPENSEO_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - open_seo_data:/app/.wrangler

volumes:
  postgres_data:
  redis_data:
  open_seo_data:
