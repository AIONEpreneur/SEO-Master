# Betrieb auf dem eigenen VPS.
#
# Alle Daten liegen in Volumes auf dem Server – Datenbank, Redis und
# Analyseergebnisse verlassen die eigene Umgebung nicht. Nach aussen ist
# ausschliesslich Caddy erreichbar, das die TLS-Zertifikate selbst verwaltet.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seomaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-seomaster}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-seomaster}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein Port nach aussen: die Datenbank ist nur im internen Netz erreichbar.
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    networks: [internal]

  web:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      APP_URL: ${APP_URL}
      ALLOWED_SIGNUP_EMAILS: ${ALLOWED_SIGNUP_EMAILS:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, extern]

  worker:
    build: .
    command: sh -c "npx tsx src/worker/index.ts"
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      # Anbindung des OpenSEO-Beistelldienstes (docs/OPENSEO-INTEGRATION.md).
      # Leer lassen, um den Anbieter abzuschalten – die Analysen laufen dann
      # ohne ihn weiter.
      OPENSEO_MCP_URL: ${OPENSEO_MCP_URL:-http://open-seo:3001/mcp}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, extern]

  # OpenSEO als Beistelldienst (docs/OPENSEO-INTEGRATION.md). Fertiges Image,
  # kein Build; Aktualisierung über `docker compose pull open-seo`.
  #
  # Bewusst KEIN ports:-Eintrag: im Modus local_noauth gibt es keine
  # Anmeldung – wer die Adresse erreicht, kann auf DataForSEO-Rechnung
  # einkaufen. Erreichbar ist der Dienst nur im Docker-Netz `extern`, in dem
  # auch der Worker hängt (und das er für DataForSEO ohnehin braucht). Für
  # den Blick in die Oberfläche: docs/OPENSEO-INTEGRATION.md, Abnahme Phase 1.
  open-seo:
    image: ghcr.io/every-app/open-seo:latest
    restart: unless-stopped
    environment:
      # Reicht die Compose-Umgebung an die Workers-Laufzeit im Container durch.
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
      AUTH_MODE: local_noauth
      PORT: '3001'
      # Das Image liefert über `vite preview` aus, und Vite blockiert fremde
      # Host-Header. Ohne diese Freigabe scheitert jeder Aufruf unter
      # http://open-seo:3001 aus dem Docker-Netz mit "Blocked request".
      ALLOWED_HOST: open-seo
      # ACHTUNG, anderes Format als DATAFORSEO_LOGIN/-PASSWORD dieser App:
      # OpenSEO erwartet base64("email:api-passwort"). Deshalb der eigene
      # Variablenname. Erzeugen mit:  echo -n "email:api-passwort" | base64
      DATAFORSEO_API_KEY: ${OPENSEO_DATAFORSEO_API_KEY:-}
      OPENSEO_TELEMETRY_DISABLED: '1'
    volumes:
      # Projekte, gespeicherte Keywords, Rank-Tracker und das Forschungs-Log.
      # Gehört in die Sicherung: ohne dieses Volume werden bereits gekaufte
      # Daten nach einem Neuaufsetzen erneut gekauft.
      - open_seo_data:/app/.wrangler
    networks: [extern]

  caddy:
    image: caddy:2-alpine
    restart: always
    # An die öffentliche Adresse gebunden statt an alle. Lauscht auf dem
    # Server noch etwas auf einer internen Adresse – ein VPN etwa –, gäbe es
    # sonst je nach Kernel-Einstellung einen Konflikt um denselben Port.
    ports:
      - '${BIND_IP:-0.0.0.0}:80:80'
      - '${BIND_IP:-0.0.0.0}:443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
    depends_on: [web]
    networks: [extern]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  open_seo_data:

networks:
  # Datenbank und Warteschlange hängen ausschliesslich hier: dieses Netz hat
  # keine Verbindung nach draussen, in keine Richtung.
  internal:
    internal: true
  # Anwendung, Worker und Caddy brauchen zusätzlich Zugang nach aussen. Ohne
  # ihn erreicht der Worker die Anbieter-APIs nicht und jede Analyse scheitert.
  extern:
