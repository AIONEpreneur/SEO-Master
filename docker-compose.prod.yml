# Betrieb auf dem eigenen VPS.
#
# Alle Daten liegen in Volumes auf dem Server – Datenbank, Redis und
# Analyseergebnisse verlassen die eigene Umgebung nicht. Nach aussen ist
# ausschliesslich Caddy erreichbar, das die TLS-Zertifikate selbst verwaltet.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seomaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-seomaster}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-seomaster}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein Port nach aussen: die Datenbank ist nur im internen Netz erreichbar.
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    networks: [internal]

  web:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      APP_URL: ${APP_URL}
      ALLOWED_SIGNUP_EMAILS: ${ALLOWED_SIGNUP_EMAILS:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, web]

  worker:
    build: .
    command: sh -c "npx tsx src/worker/index.ts"
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
    depends_on: [web]
    networks: [web]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  # Datenbank und Redis erreichen nur die Anwendungsdienste.
  internal:
    internal: true
  web:
