# nginx-Konfiguration für SEO-Master hinter einem bereits laufenden Webserver.
#
# Ablegen unter /etc/nginx/sites-available/seo-master, dann:
#   ln -s /etc/nginx/sites-available/seo-master /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Zertifikat anschliessend mit certbot holen:
#   certbot --nginx -d seo-master.aionepreneur.com
#
# certbot ergänzt die TLS-Zeilen selbst; dieser Block deckt nur HTTP ab.

server {
    listen 80;
    listen [::]:80;
    server_name seo-master.aionepreneur.com;

    # Analysen laufen mehrere Minuten. Ohne erhöhte Zeitlimits bricht nginx
    # eine laufende Anfrage mit 504 ab.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Für die Fortschrittsanzeige während eines Laufs.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
