# Betrieb auf einem VPS, auf dem bereits ein Webserver läuft.
#
# Unterschied zu docker-compose.prod.yml: kein eigener Caddy. Die Anwendung
# lauscht nur auf 127.0.0.1:3000 – erreichbar ausschliesslich vom Server
# selbst. Der bereits vorhandene Webserver (nginx, Caddy, Apache) nimmt die
# Anfragen von aussen entgegen und reicht sie weiter.
#
# Beispielkonfigurationen dafür liegen in deploy/reverse-proxy/.
#
#   docker compose -f docker-compose.vps.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seomaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-seomaster}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-seomaster}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    networks: [internal]

  web:
    build: .
    restart: always
    # Nur an die Loopback-Adresse gebunden: von aussen führt kein Weg direkt
    # hierher, ausschliesslich über den vorhandenen Webserver.
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      APP_URL: ${APP_URL}
      ALLOWED_SIGNUP_EMAILS: ${ALLOWED_SIGNUP_EMAILS:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, extern]

  worker:
    build: .
    command: sh -c "npx tsx src/worker/index.ts"
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seomaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seomaster}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, extern]

volumes:
  postgres_data:
  redis_data:

networks:
  # Datenbank und Warteschlange hängen ausschliesslich hier: dieses Netz hat
  # keine Verbindung nach draussen, in keine Richtung.
  internal:
    internal: true
  # Anwendung und Worker brauchen zusätzlich Zugang nach aussen. Ohne ihn
  # erreicht der Worker die Anbieter-APIs nicht und jede Analyse scheitert.
  extern:
